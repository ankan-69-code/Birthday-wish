
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Ankan</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #ff6f61; --glass: rgba(255, 255, 255, 0.15); }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Login Screen */
        #input-screen {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            z-index: 10;
            color: white;
            transition: all 0.5s ease;
        }

        input {
            padding: 15px;
            border-radius: 50px;
            border: none;
            width: 250px;
            text-align: center;
            outline: none;
            margin-top: 20px;
        }

        button.unlock-btn {
            margin-top: 20px;
            padding: 12px 40px;
            border-radius: 50px;
            border: none;
            background: #fff;
            color: #e73c7e;
            font-weight: bold;
            cursor: pointer;
        }

        /* Card Container */
        #card-container {
            display: none;
            width: 380px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
            padding: 40px 30px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.8s;
            color: white;
            z-index: 5;
        }

        .show-card { opacity: 1 !important; transform: scale(1) !important; }

        /* Photo Area */
        .photo-frame {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.8);
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-inner h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .message-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: left;
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 80px;
        }

        /* Balloons */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 50px;
            background: red;
            border-radius: 50%;
            opacity: 0.8;
            animation: floatUp 8s linear forwards;
        }
        @keyframes floatUp { to { transform: translateY(-120vh); } }

    </style>
</head>
<body>

    <div id="input-screen">
        <h2><i class="fas fa-birthday-cake"></i> Iqruu's Birthday</h2>
        <input type="password" id="passwordInput" placeholder="Aj ki date? (dd/mm/yyyy)">
        <br>
        <button class="unlock-btn" onclick="checkPassword()">Enter</button>
    </div>

    <div id="card-container">
        <div class="photo-frame">
            <img src="photo.jpg" alt="Iqruu's Photo" onerror="this.src='https://images.unsplash.com/photo-1504593811423-6dd665756598?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80'">
        </div>

        <div class="card-inner">
            <h1>Happy Birthday<br>Iqruuuu💋❤️!</h1>
            
            <div class="message-box">
                <span id="typewriterText"></span><span style="border-right: 2px solid white; animation: blink 1s infinite;">&nbsp;</span>
            </div>
        </div>
    </div>

    <script>
        const passCode = "03/06/2026";
        // CHANGE THE MESSAGE HERE
        const message = "Happpyyyy Brithdayyyy My dear babyyy gurllll 🎂❤️ wish uhhh many many happy Returns of the Dayy To the girl who owns my heart 😚💕 I luvvvv uhh more than words can ever explain🫠❤️ Loving you is the easiest and best thing that ever happened to me I hope this year brings uh as much happiness as uhh bring into my life….🫠🫂 Stay happy stay mine forever🤞🏻💌 aap haste rehna baaki sab mai sambhal lunga😚🫂…..I luvvvv uhhhh so so so muchhhhh 💋💋💋💋💋";

        function checkPassword() {
            const input = document.getElementById('passwordInput').value.toLowerCase().trim();
            if (input === passCode) {
                document.getElementById('input-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('input-screen').style.display = 'none';
                    revealCard();
                }, 500);
            } else {
                alert("Wrong password!");
            }
        }

        function revealCard() {
            const card = document.getElementById('card-container');
            card.style.display = 'block';
            setTimeout(() => card.classList.add('show-card'), 50);

            // Start Typing
            let i = 0;
            function type() {
                if (i < message.length) {
                    document.getElementById("typewriterText").innerHTML += message.charAt(i);
                    i++;
                    setTimeout(type, 50);
                }
            }
            type();

            // Fireworks
            const duration = 5000;
            const end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, spread: 100, origin: { y: 0.6 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());

            // Balloons
            for(let j=0; j<30; j++) {
                let b = document.createElement('div');
                b.className = 'balloon';
                b.style.left = Math.random()*100 + 'vw';
                b.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
                b.style.animationDuration = (Math.random()*5 + 5) + 's';
                document.body.appendChild(b);
            }
        }
    </script>
</body>
</html>
